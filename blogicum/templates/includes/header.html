<header>
  {% with request.resolver_match.view_name as view_name %}
  <nav class="navbar navbar-light" style="background-color: lightskyblue">
    <div class="container">
      <a class="navbar-brand" href="{% url 'blog:index' %}">
        <img src="{% static 'img/logo.png' %}" width="30" height="30" class="d-inline-block align-top" alt="Logo">
        Блогикум
      </a>
      <ul class="nav  nav-pills">
        <li class="nav-item">
          <a class="nav-link {% if view_name == 'blog:index' or 'category' in view_name or 'detail' in view_name %}
              active{% endif %}" href="{% url 'blog:index' %}">
            Лента записей
          </a>
          Лента записей
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if view_name == 'pages:about' %}
              active{% endif %}" href="{% url 'pages:about' %}">
            О проекте
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if view_name == 'pages:rules' %}
              active{% endif %}" href="{% url 'pages:rules' %}">
            Наши правила
          </a>
        </li>
      </ul>
    </div>
  </nav>
  {% endwith %}
</header>
